# ---------- 3:45.6 "the part you can copy" / "you hire a general contractor" / "does not lay the bricks" ----------
# The first frame of the contractor B-roll, held, with the camera moving on his words. The clip then starts
# from this same frame in the next scene. Story px = 50 + 0.677 * frame x, 155 + 0.677 * frame y.
- kind: stage
  at: w717
  elements:
    - type: story
      actors:
        - { id: lot, kind: image, src: media/D/plans-first.png, w: 1300, h: 731, x: 700, y: 520 }
        - { id: copy, kind: badge, x: 700, y: 75, text: "The part you can copy", icon: copy, color: accent }
        - { id: you, kind: badge, x: 372, y: 262, text: "You", icon: user, at: w740 }
        - { id: gc, kind: badge, x: 790, y: 262, text: "General contractor", icon: hard-hat, color: accent, at: w743 }
        - { id: no, kind: icon, icon: ban, tile: false, size: 190, x: 190, y: 730, color: bad, at: w748 }
      beats:
        - { at: w734, exit: copy }
        - { at: w736, follow: [130, 190, 960, 679] }
        - { at: w740, pulse: you }
        - { at: w743, pulse: gc }
        - { at: w745, follow: all }
        - { at: w745, exit: you }
        - { at: w748, shake: no }
        - { at: w751, pulse: no }

